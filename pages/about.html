<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>memetica</title>  

  <style>

    body {
      margin: 0;
      font-family: "Arial", sans-serif;
      background: #fbfbfb;
      color: #2c2c2c;
    }

    /* HEADER */
    header {
      font-family: "Arial", sans-serif;
      text-align: left;
      padding: 25px 50px;
      font-size: 10px;
      text-transform: lowercase;
    }

    /* CONTENEDOR */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 10px;
    }

    /* POST (tipo tumblr card) */
    .post {
    
      background: #fbfbfb;
      border: 0px solid #e3e3e3;
      margin-bottom: 60px;
      padding: 10px;
      border-radius: 0px;

      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    img {
      order: 2;
      max-width: 500px;
      width: 100%;
      height: auto;
      border-radius: 0px;
    }

    .text {
      order: 1;
      flex: 1;
      text-align: right;
    }

    .text h2 {
      font-family: "Arial", sans-serif;
      font-size: 10px;
      margin-top: 0;
      font-style: italic;
    }

    .text p {
      font-size: 7pt;
      line-height: 2;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      color: #B7F719;
    }

    footer {
      text-align: right;
      padding: 40px;
      font-size: 7pt;
      color: #777;
    }

  </style>
</head>

<body>

<header>
   <a href="index">memetica</a> <br>
  
</header>

<div class="container">

  <!-- POST 1 -->
  <div class="post">
    
      <p>
¿que pasa si un dia se cae internet? ¿hay un archivo de todo lo viste hoy? <br> memetica.memetica@gmail.com
      </p>
      
    </div>
  </div>
  
<footer>
  © bsas
</footer>

</body>
</html>
