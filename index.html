<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 10pt;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      color: #222;
    }

    header {
      background-color: #333;
      color: white;
      text-align: center;
      padding: 20px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 15px;
      background-color: #333;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mi Sitio en GitHub Pages</h1>
    <p>Texto simple con fotos</p>
  </header>

  <main>

    <div class="card">
      <h2>Título 1</h2>
      <p>
        Aquí puedes escribir un texto descriptivo.
        Todo el sitio está en Arial tamaño 10 puntos.
      </p>

      <img src="foto1.png" alt="Foto 1">
    </div>

    <div class="card">
      <h2>Título 2</h2>
      <p>
        Puedes agregar más bloques con imágenes y texto.
      </p>

      <img src="foto2.png" alt="Foto 2">
    </div>

  </main>

  <footer>
    © 2026 Mi Página
  </footer>

</body>
</html>
