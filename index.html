<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>memetica</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: Roboto, sans-serif;
      background: #fbfbfb;
      color: #2c2c2c;
    }

    /* HEADER */
    header {
      font-family: "Arial", serif;
      text-align: left;
      padding: 25px 50px;
      font-size: 15px;
      text-transform: lowercase;
    }

    /* CONTENEDOR */
    .container {
      max-width: 900px;
      margin: auto;
      padding: 10px;
    }

    /* POST (tipo tumblr card) */
    .post {
    
      background: #fbfbfb;
      border: 0px solid #e3e3e3;
      margin-bottom: 60px;
      padding: 10px;
      border-radius: 0px;

      display: flex;
      gap: 25px;
      align-items: flex-start;
    }

    img {
      order: 2;
      max-width: 600px;
      width: 100%;
      height: auto;
      border-radius: 0px;
    }

    .text {
      order: 1;
      flex: 1;
      text-align: right;
    }

    .text h2 {
      font-family: Roboto, san-serif;
      font-size: 10px;
      margin-top: 0;
      font-style: italic;
    }

    .text p {
      font-size: 9,5pt;
      line-height: 2;
    }

    a {
      color: #000;
      text-decoration: none;
    }

    a:hover {
      color: #B7F719;
    }

    footer {
      text-align: right;
      padding: 40px;
      font-size: 7pt;
      color: #777;
    }

  </style>
</head>

<body>

<header>
  memetica<br>
  
</header>

<div class="container">

  <!-- POST 1 -->
  <div class="post">
    <img src="fotos/sourcemyheart.gif" alt="">

    <div class="text">
      <h2>  </h2>
      <p>

      </p>
      
    </div>
  </div>

  <!-- POST 2 -->
  <div class="post">
    <img src="fotos/noseeee.gif" alt="">

    <div class="text">
     
      <p>
        
      </p>
    </div>
  </div>

</div>

   <!-- POST 3 -->
  <div class="post">
    <img src="meme_03.jpg" alt="">

    <div class="text">
     
      <p>
        
      </p>
    </div>
  </div>
  
<footer>
  © bsas
</footer>

</body>
</html>
